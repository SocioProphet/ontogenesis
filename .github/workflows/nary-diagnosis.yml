name: nary-diagnosis

on:
  pull_request:
    paths:
      - "Domains/nary-diagnosis.ttl"
      - "shapes/nary-diagnosis.shacl.ttl"
      - "scripts/verify_nary_diagnosis.py"
      - ".github/workflows/nary-diagnosis.yml"
  push:
    branches: [ main ]
    paths:
      - "Domains/nary-diagnosis.ttl"
      - "shapes/nary-diagnosis.shacl.ttl"
      - "scripts/verify_nary_diagnosis.py"
      - ".github/workflows/nary-diagnosis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install rdflib pyshacl
      - name: Verify n-ary Diagnosis round-trip
        run: python scripts/verify_nary_diagnosis.py
